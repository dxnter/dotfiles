# ~/.config/starship.toml

# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

command_timeout = 5000

# The 30 ms default is too short for the first listing of a cold directory
# (~/Downloads after login), which prints a "Scanning current directory timed out" warning.
scan_timeout = 100

# One line: context on the left, languages pushed right by $fill. Input wraps to the next line.
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$package\
$fill\
$nodejs\
$bun\
$php\
$pulumi\
$rust\
$java\
$golang\
$python\
$docker\
$terraform\
$vagrant\
$conda\
$aws\
$container\
$jobs\
$cmd_duration"""

# Carbonfox (github.com/EdenEast/nightfox.nvim), matching Ghostty's theme.
# Carbonfox has no true yellow or orange: its "yellow" is teal.
palette = "carbonfox"

[palettes.carbonfox]
fg = "#f2f4f8"
subtle = "#6e6f70"
red = "#ee5396"
green = "#25be6a"
teal = "#08bdba"
blue = "#78a9ff"
cyan = "#33b1ff"
purple = "#be95ff"
pink = "#ff7eb6"

[fill]
symbol = " "

[line_break]
disabled = true

# Path before the repository dimmed, repository name bright, path inside it blue.
[directory]
style = "bold blue"
before_repo_root_style = "subtle"
repo_root_style = "bold fg"
read_only = " "
read_only_style = "red"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
conflicted = "[=$count ](bold red)"
staged = "[+$count ](green)"
modified = "[!$count ](teal)"
renamed = "[»$count ](teal)"
deleted = "[✘$count ](red)"
untracked = "[?$count ](subtle)"
stashed = "[ $count ](pink)"
ahead = "[⇡$count ](blue)"
behind = "[⇣$count ](blue)"
diverged = "[⇡$ahead_count ⇣$behind_count ](blue)"

[git_commit]
commit_hash_length = 8
style = "subtle"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "pink"

[package]
format = ' [$symbol$version]($style)'
style = "subtle"

[jobs]
symbol = ""
style = "bold red"
number_threshold = 1
format = "[$symbol]($style) "

[cmd_duration]
min_time = 5_000
show_milliseconds = false
format = "[ $duration]($style)"
style = "teal"

# Languages: coloured icon, muted version, so the right side stays quiet.
[nodejs]
format = "[$symbol]($style)[($version )](subtle)"
style = "green"

[bun]
format = "[$symbol]($style)[($version )](subtle)"

[php]
symbol = " "
format = "[$symbol]($style)[$version](subtle) "
style = "purple"

[python]
format = '[${symbol}]($style)[${pyenv_prefix}(${version} )(\($virtualenv\) )](subtle)'
style = "blue"

[rust]
symbol = " "
format = "[$symbol]($style)[$version](subtle) "
style = "red"

[golang]
format = "[$symbol]($style)[$version](subtle) "
style = "cyan"

[vagrant]
format = '[$symbol]($style)[($version )](subtle)'

# Loaded on top of config.toml when MISE_ENV includes work (set in ~/.zshenv.local on a work Mac).
# Tools only the work Mac needs.

[tools]
aws-cli = "latest"
opentofu = "latest"
actionlint = "latest"
# actionlint checks workflow `run:` scripts with shellcheck when it's on PATH
shellcheck = "latest"
zizmor = "latest"
"pipx:gitingest" = "latest"
